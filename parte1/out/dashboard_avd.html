
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Dashboard AVD - Malha Aérea</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-color: #0f172a;
                --glass-bg: rgba(30, 41, 59, 0.4);
                --glass-border: rgba(255, 255, 255, 0.1);
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --accent: #3b82f6;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
            body {
                background: linear-gradient(135deg, #020617 0%, #1e1e2f 100%);
                color: var(--text-main);
                min-height: 100vh;
                padding: 2.5rem;
                display: flex;
                flex-direction: column;
                gap: 2rem;
            }
            
            .fade-in {
                opacity: 0;
                transform: translateY(30px);
                transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            }
            .fade-in.visible { opacity: 1; transform: translateY(0); }
            
            header { text-align: center; margin-bottom: 0.5rem; }
            header h1 { font-size: 2.5rem; font-weight: 700; background: -webkit-linear-gradient(#93c5fd, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
            header p { color: var(--text-muted); font-size: 1rem; margin-top: 0.5rem; }

            .kpi-container { display: flex; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; }
            
            .kpi-card {
                flex: 1; min-width: 220px;
                background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
                border: 1px solid var(--glass-border); border-radius: 16px;
                padding: 1.8rem; text-align: center;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                position: relative;
                overflow: hidden;
            }
            
            .kpi-card::before {
                content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
                background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
                opacity: 0; transition: opacity 0.3s ease;
            }
            
            .kpi-card:hover {
                transform: translateY(-8px); 
                box-shadow: 0 15px 30px rgba(59, 130, 246, 0.25);
                border-color: rgba(96, 165, 250, 0.5);
            }
            .kpi-card:hover::before { opacity: 1; }
            
            .kpi-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 0.5rem; position: relative; z-index: 1; }
            .kpi-value { font-size: 2rem; font-weight: 700; color: var(--text-main); position: relative; z-index: 1; }
            .kpi-value span { font-size: 1.1rem; font-weight: 300; color: var(--accent); }

            .chart-container {
                background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
                border: 1px solid var(--glass-border); border-radius: 16px;
                padding: 1rem 1.5rem 2.5rem 1.5rem; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
                flex-grow: 1;
                display: flex; flex-direction: column;
            }
        </style>
    </head>
